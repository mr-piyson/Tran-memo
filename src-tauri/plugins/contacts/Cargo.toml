[package]
name = "tauri-plugin-contacts"
version = "0.1.0"
description = "Read device contacts on Android and iOS"
edition = "2024"
links = "tauri-plugin-contacts"
build = "build.rs"

[lib]
name = "tauri_plugin_contacts"

[dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-plugin = { version = "2", features = ["build"] }
