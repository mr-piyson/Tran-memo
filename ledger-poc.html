<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledger App – Dark UI PoC</title>
<!--
  LEDGER APP – HTML PROOF OF CONCEPT (single file, no build step)
  Purpose: a faithful, interactive reference of the "Dark UI theme" Figma board (11 mobile screens, 360x640).
  Feed this file + LEDGER_DESIGN.md to an AI to generate the React + shadcn/ui implementation.

  CONVENTIONS (so an AI can map 1:1 to React/shadcn):
  - CSS variables in :root use the shadcn/ui token names (--background, --card, --primary ...).
  - Every UI piece carries a  data-ui="<ComponentName>"  attribute = the React component to build.
    data-shadcn="..." names the shadcn/ui primitive it should be built on.
  - Screens are pure functions of state:  screens.<name>(state, params) -> HTML  (= one React route/page each).
  - State shape (DATA) = the TypeScript types in LEDGER_DESIGN.md.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  /* ---- shadcn/ui tokens (dark only) ---- */
  --background:#1a1a1a;
  --foreground:#f2f2f2;
  --card:#2b2b2b;
  --card-foreground:#f2f2f2;
  --popover:#2b2b2b;
  --popover-foreground:#f2f2f2;
  --primary:#0072a5;          /* FAB, active tab, chips */
  --primary-hover:#1a80ae;    /* Submit button, focus ring */
  --primary-foreground:#ffffff;
  --secondary:#292929;        /* inputs, secondary buttons */
  --secondary-foreground:#d9d9d9;
  --muted:#232323;
  --muted-foreground:#8a8a8a;
  --accent:#3a3a3a;           /* hover / selected menu row */
  --accent-foreground:#f2f2f2;
  --destructive:#b0063f;
  --destructive-foreground:#ffffff;
  --border:#3a3a3a;
  --input:#292929;
  --ring:#1a80ae;
  --radius:12px;
  /* ---- app-specific semantic tokens ---- */
  --panel:#1c1c1c;            /* form panel / field wells */
  --amount-blue:#387cf8;      /* neutral deal amount */
  --bar-blue:#356bce;
  --success:#00a859;          /* positive amount, valid input */
  --danger:#c2074f;           /* negative amount, invalid input */
  --bar-red:#980542;
  --bar-green:#1a5a3b;
  --excel:#193c29; --excel-border:#1f5a3a;
  --delete-bg:#3d1618; --delete-border:#6b2124;
  --done-bg:#1b3a5c;  --done-border:#26527f;
  --shadow:0 2px 6px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Roboto',system-ui,sans-serif;background:#0e0e0e;color:var(--foreground);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,textarea{font:inherit;color:inherit;background:none;border:0;outline:0}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- page chrome (not part of the app) ---------- */
.toolbar{position:sticky;top:0;z-index:50;display:flex;gap:12px;align-items:center;padding:10px 16px;background:#111;border-bottom:1px solid #2a2a2a}
.toolbar h1{font-size:14px;font-weight:500;margin-right:auto;color:#cfcfcf}
.seg{display:flex;background:#222;border-radius:8px;padding:3px}
.seg button{padding:6px 14px;border-radius:6px;font-size:13px;color:#9a9a9a}
.seg button.on{background:var(--primary);color:#fff}
.stage{display:flex;justify-content:center;padding:28px 16px 60px}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,360px);gap:36px 28px;justify-content:center;padding:28px 16px 60px}
.cell .label{font-size:12px;color:#8a8a8a;margin:0 0 8px 4px}
.cell .label b{color:#cfcfcf;font-weight:500}

/* ---------- phone ---------- */
.phone{position:relative;width:360px;height:640px;background:var(--background);border-radius:22px;overflow:hidden;border:1px solid #2c2c2c;box-shadow:0 10px 40px rgba(0,0,0,.6);display:flex;flex-direction:column;isolation:isolate}
.screen{flex:1;display:flex;flex-direction:column;min-height:0;position:relative}
.body{flex:1;overflow-y:auto;min-height:0;scrollbar-width:none}
.body::-webkit-scrollbar{display:none}

/* AppHeader  (shadcn: none – plain header w/ Avatar + Button[ghost,icon]) */
.header{display:flex;align-items:center;gap:10px;height:60px;padding:0 12px;background:var(--card);box-shadow:0 2px 4px rgba(0,0,0,.35);flex:none;z-index:2}
.header .grow{flex:1;min-width:0}
.header .title{font-size:16px;line-height:1.15}
.header .sub{font-size:12px;color:var(--muted-foreground)}
.header .sub .pos{color:var(--success)} .header .sub .neg{color:var(--danger)}
.icon-btn{width:36px;height:36px;display:grid;place-items:center;border-radius:50%;color:#d6d6d6}
.icon-btn:hover{background:rgba(255,255,255,.08)}
.avatar{border-radius:50%;background:#c3d7f9;position:relative;overflow:hidden;flex:none}
.avatar::before{content:"";position:absolute;left:50%;top:22%;width:34%;height:34%;border-radius:50%;background:#5b9bf5;transform:translateX(-50%)}
.avatar::after{content:"";position:absolute;left:50%;top:60%;width:68%;height:60%;border-radius:50%;background:#5b9bf5;transform:translateX(-50%)}
.avatar.s40{width:40px;height:40px}.avatar.s48{width:48px;height:48px}.avatar.s76{width:76px;height:76px}.avatar.s64{width:64px;height:64px}

/* DealCard  (shadcn: Card) */
.deal{margin:10px 12px 0;border-radius:12px;background:linear-gradient(#2e2e2e,#262626);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;position:relative}
.deal .top{display:flex;justify-content:space-between;align-items:baseline;padding:8px 10px 3px}
.deal .amt{font-size:18px;font-weight:400;letter-spacing:.2px}
.deal .inv{font-size:11px;color:#dcdcdc}
.deal .bar{height:3px;background:linear-gradient(90deg,var(--c),transparent 92%)}
.deal .bot{display:flex;justify-content:space-between;align-items:flex-end;padding:6px 10px 6px;background:linear-gradient(#262626,#2b2b2b)}
.deal .note{font-size:10px}
.deal .dt{font-size:8px;color:#9a9a9a;text-align:right;line-height:1.25}
.deal.blue{--c:var(--bar-blue)} .deal.blue .amt{color:var(--amount-blue)}
.deal.red{--c:var(--bar-red)} .deal.red .amt{color:var(--danger)}
.deal.green{--c:var(--bar-green)} .deal.green .amt{color:var(--success)}
.deal .x{position:absolute;right:6px;top:6px;width:14px;height:14px;border-radius:50%;background:#8a8a8a;color:#222;display:grid;place-items:center}
.deal .x svg{width:9px;height:9px;stroke-width:3}

/* Composer  (shadcn: Input + Button[ghost,icon]) */
.composer{margin:0 12px 12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow);overflow:hidden;flex:none}
.composer .row1{display:flex;align-items:center;gap:8px;padding:8px 10px 4px}
.composer .clear{width:14px;height:14px;border-radius:50%;background:#8a8a8a;color:#222;display:grid;place-items:center}
.composer .clear svg{width:9px;height:9px;stroke-width:3}
.composer .amount{flex:1;text-align:right;font-size:18px;color:var(--success);min-width:0}
.composer .amount::placeholder{color:#3b6d52}
.composer .bar{height:3px;background:linear-gradient(90deg,transparent,var(--success))}
.composer .row2{display:flex;align-items:center;gap:8px;padding:6px 10px 8px}
.composer .note-in{flex:1;font-size:14px;min-width:0}
.composer .note-in::placeholder{color:#d9d9d9}
.composer .send{color:#8a8a8a}.composer .send.ready{color:var(--primary-hover)}

/* FAB  (shadcn: Button size=icon, custom radius) */
.fab{position:absolute;left:16px;bottom:16px;width:54px;height:54px;border-radius:16px;background:var(--primary);display:grid;place-items:center;box-shadow:0 4px 10px rgba(0,0,0,.5);color:#cfe9f5;z-index:3}
.fab svg{width:28px;height:28px}.fab.right{left:auto;right:16px}.fab.up{bottom:96px}
.fab:active{transform:scale(.96)}

/* Tabs  (shadcn: Tabs) */
.tabs{display:flex;background:var(--card);flex:none}
.tabs button{flex:1;height:44px;display:grid;place-items:center;position:relative}
.tabs .tab-ic{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;background:#bdbdbd;color:#2b2b2b}
.tabs .tab-ic svg{width:12px;height:12px;stroke-width:2.6}
.tabs button.on .tab-ic{background:var(--primary);color:#cfe9f5}
.tabs button.on::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:3px;border-radius:3px;background:linear-gradient(90deg,transparent,var(--primary-hover),transparent)}

/* Empty state */
.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;color:#4b4b4b;font-size:26px;font-weight:300;padding-bottom:60px}
.empty svg{width:160px;height:160px;fill:#555;stroke:none}

/* HistoryRow */
.hrow{display:grid;grid-template-columns:1fr 1fr auto;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid #262626;cursor:pointer}
.hrow:hover{background:rgba(255,255,255,.03)}
.hrow .d{font-size:12px;color:#9a9a9a}.hrow .p{font-size:14px;color:var(--success)}
.hrow .n{font-size:15px}.hrow .ph{font-size:12px;color:#9a9a9a;text-align:right}

/* Form  (shadcn: Form + Input + Select + Calendar/Popover + Button) */
.sheet{margin:10px 8px 8px;background:var(--card);border-radius:14px;flex:1;display:flex;flex-direction:column;min-height:0;box-shadow:var(--shadow)}
.contact{margin:8px 8px 0;display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel);border-radius:10px}
.contact .nm{font-size:16px}.contact .ph{font-size:11px;color:#8a8a8a;margin-top:6px}
.fields{flex:1;overflow:auto;padding:10px 8px;display:flex;flex-direction:column;gap:9px;background:var(--panel);margin:8px;border-radius:12px;scrollbar-width:none}
.field{display:flex;align-items:center;gap:10px;height:50px;padding:0 12px;border-radius:10px;border:2px solid var(--input);background:var(--secondary);color:#8a8a8a;transition:border-color .15s}
.field input{flex:1;font-size:17px;color:#f2f2f2;min-width:0}
.field input::placeholder{color:#8a8a8a}
.field.date{height:54px;border-color:var(--primary-hover)}
.field.date .lbl{font-size:10px;color:var(--primary-hover);display:block;line-height:1}
.field.date input{font-size:17px;color-scheme:dark;width:100%}
.field.ok{border-color:var(--success)} .field.bad{border-color:var(--danger)} .field:focus-within{border-color:var(--primary-hover)}
.actions{display:flex;gap:10px;padding:8px 8px 10px;flex:none}
.btn{flex:1;height:42px;border-radius:10px;border:2px solid var(--primary-hover);background:var(--secondary);font-size:16px;display:flex;align-items:center;justify-content:center;gap:10px;color:var(--secondary-foreground)}
.btn.primary{background:var(--primary-hover);border-color:var(--primary-hover);color:#fff}
.btn:active{filter:brightness(1.2)}

/* Detail rows  (shadcn: Badge for tags, Textarea, Button variants) */
.drow{display:flex;height:34px;border-radius:9px;background:var(--card);border:2px solid #262626;overflow:hidden;margin:0 14px 8px}
.drow .k{width:104px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:12px;background:#262626;color:#d0d0d0;flex:none}
.drow .v{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;font-size:12px;background:var(--card);padding:0 8px;min-width:0}
.drow .v input{width:100%;text-align:center;font-size:12px}
.drow .k svg{width:15px;height:15px}
.drow.desc{height:auto;flex-direction:column;background:#262626}
.drow.desc .k{width:auto;height:30px}
.drow.desc textarea{margin:0 6px 6px;border-radius:7px;background:var(--panel);padding:6px 8px;font-size:12px;resize:none;height:44px;width:calc(100% - 12px)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:99px;font-size:11px;color:#eee}
.badge.green{background:#4f7a3a}.badge.pink{background:#7a3f57}
.badge button{display:grid;place-items:center;opacity:.8}.badge svg{width:10px;height:10px}
.addrow{margin:0 14px;height:30px;border-radius:9px;background:var(--card);display:grid;place-items:center;color:#8a8a8a}
.btn2{height:38px;border-radius:9px;border:2px solid;display:flex;align-items:center;gap:10px;padding:0 12px;font-size:14px;flex:1}
.btn2.excel{background:var(--excel);border-color:var(--excel-border)}
.btn2.export{background:var(--secondary);border-color:#303030}
.btn2.delete{background:var(--delete-bg);border-color:var(--delete-border)}
.btn2.done{background:var(--done-bg);border-color:var(--done-border)}
.btn2 svg{width:18px;height:18px}
.xl{width:18px;height:18px;border-radius:3px;background:#1f9d5a;display:grid;place-items:center;font-size:10px;font-weight:700;color:#fff}

/* Search */
.searchbar{background:var(--card);padding:10px 12px 8px;flex:none;box-shadow:0 2px 4px rgba(0,0,0,.35)}
.sinput{display:flex;align-items:center;gap:10px;height:40px;padding:0 12px;border-radius:10px;border:2px solid #0b5f88;background:var(--panel);color:#bdbdbd}
.sinput input{flex:1;font-size:16px;min-width:0}.sinput input::placeholder{color:#9a9a9a}
.chips{display:flex;gap:8px;margin-top:9px}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:99px;background:#3d3d3d;color:#a0a0a0;font-size:12px}
.chip svg{width:12px;height:12px}.chip.on{background:var(--primary);color:#fff}
.bubble-wrap{display:flex;padding:0 12px}.bubble-wrap.r{justify-content:flex-end}
.bubble-wrap .deal{margin:10px 0 0;width:170px}
.divider{margin:12px 0 0;display:flex;align-items:center;justify-content:center;height:12px;position:relative}
.divider::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#0b6a99}
.divider span{position:relative;background:var(--primary);color:#fff;font-size:8px;padding:2px 14px;border-radius:3px}

/* Orders panel */
.orders-tabs{display:flex;gap:18px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid #2f2f2f;border-top:1px solid #2f2f2f;scrollbar-width:none}
.orders-tabs button{font-size:16px;color:#9a9a9a;white-space:nowrap;padding-bottom:4px;border-bottom:2px solid transparent}
.orders-tabs button.on{color:#fff;border-color:var(--primary-hover)}

/* Overlays */
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55);z-index:20}
.drawer{position:absolute;left:0;top:0;bottom:0;width:78%;background:var(--background);z-index:21;padding:22px 16px;box-shadow:6px 0 20px rgba(0,0,0,.6);animation:slide .18s ease-out}
.drawer .nm{font-size:22px;margin-top:10px}
.drawer nav{margin-top:26px;display:flex;flex-direction:column;gap:4px}
.drawer nav button{display:flex;gap:12px;align-items:center;height:44px;padding:0 10px;border-radius:8px;font-size:15px;text-align:left}
.drawer nav button:hover{background:var(--accent)}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
.menu{position:absolute;right:10px;top:54px;width:188px;background:var(--popover);border-radius:12px;padding:8px 8px 10px;z-index:22;box-shadow:0 8px 24px rgba(0,0,0,.65);animation:pop .12s ease-out}
.menu h4{font-size:13px;font-weight:500;padding:2px 4px 6px}
.menu .list{background:var(--background);border-radius:10px;padding:6px}
.menu button{display:flex;width:100%;align-items:center;gap:10px;height:28px;padding:0 8px;border-radius:6px;font-size:12px;font-weight:500;text-align:left}
.menu button svg{width:14px;height:14px}.menu button.sel,.menu button:hover{background:var(--accent)}
.menu hr{border:0;border-top:1px solid #3a3a3a;margin:5px 2px}
.menu .logout{color:var(--danger)}
@keyframes pop{from{transform:scale(.94);opacity:0;transform-origin:top right}}
.toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);background:#f2f2f2;color:#111;font-size:12px;padding:8px 14px;border-radius:99px;z-index:40;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:pop .15s}

/* Login */
.login{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding-bottom:70px}
.login svg.logo{width:290px;height:310px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.55))}
.pill{width:216px;height:48px;border-radius:99px;font-size:19px;box-shadow:0 5px 10px rgba(0,0,0,.5)}
.pill.blue{background:linear-gradient(#00a0e6,#0082bd);color:#fff;margin-top:36px}
.pill.light{background:linear-gradient(#f0f0f0,#c9c9c9);color:var(--amount-blue);margin-top:10px}
.dim{opacity:.35;pointer-events:none}
</style>
</head>
<body>

<div class="toolbar">
  <h1>Ledger App · Dark UI PoC</h1>
  <div class="seg" id="mode">
    <button data-m="proto" class="on">Prototype</button>
    <button data-m="gallery">All 11 screens</button>
  </div>
</div>
<div id="root"></div>

<script>

/* =====================================================================
   FORM VALIDATION (zod in the real app)
   ===================================================================== */
function validate(f){return{
  name:f.name.trim().length>=2,
  phone:/^\+?[\d\s-]{8,15}$/.test(f.phone.trim()),
  email:/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(f.email.trim()),
  budget:f.budget!==''&&!isNaN(+f.budget)&&+f.budget>0
}}
function findDeal(st,id){for(const p of st.data.people){const d=p.deals.find(x=>x.id===id);if(d)return{p,d}}return{p:st.data.people[0],d:st.data.people[0].deals[0]}}
const nextInv=st=>1+Math.max(...st.data.people.flatMap(p=>p.deals.map(d=>+d.invoice.slice(4))));
const todayISO=()=>new Date().toISOString().slice(0,10);

/* =====================================================================
   PHONE  – tiny router + store  (== React Router + Zustand)
   ===================================================================== */
function Phone(el,start,params={},opts={}){
  const st={
    data:structuredClone(DATA),stack:[{name:start,params}],overlay:opts.overlay||null,toast:null,
    draft:{amount:'',note:''},search:{q:'',mode:'price'},ordersTab:null,
    form:Object.assign({date:todayISO(),name:'',phone:'',email:'',budget:'',touched:{}},opts.form||{})
  };
  const top=()=>st.stack[st.stack.length-1];
  const go=(name,p={})=>{st.overlay=null;st.stack.push({name,params:p});render()};
  const replace=(name,p={})=>{st.overlay=null;st.stack=[{name,params:p}];render()};
  const back=()=>{st.overlay=null;if(st.stack.length>1)st.stack.pop();render()};
  const toast=m=>{st.toast=m;render();clearTimeout(st._t);st._t=setTimeout(()=>{st.toast=null;render()},1600)};
  const curPerson=()=>{for(let i=st.stack.length-1;i>=0;i--){const q=st.stack[i].params;if(q&&q.id&&st.data.people.some(p=>p.id===q.id))return q.id}return st.data.people[0].id};

  function render(){
    const {name,params}=top();
    let html=screens[name](st,{...params,personId:curPerson()});
    if(name==='person'||name==='detail'||name==='addDeal'||name==='search'||name==='orders'||name==='history'){/* params.id may be deal id */}
    // inject profile drawer for screens that open it
    if(name==='profile'){html=screens.history(st);st.overlay='drawer';html=screens.history(st)}
    el.innerHTML=html+(st.toast?`<div class="toast">${esc(st.toast)}</div>`:'');
    const focus=st._focus;if(focus){const n=el.querySelector('#'+focus);if(n){n.focus();try{n.setSelectionRange(n.value.length,n.value.length)}catch{}}}
  }

  el.addEventListener('click',e=>{
    const t=e.target.closest('[data-go],[data-back],[data-act],[data-tab]');if(!t||!el.contains(t))return;
    st._focus=null;
    if(t.dataset.back!==undefined)return back();
    if(t.dataset.tab){const m={deals:['home'],history:['history'],orders:['orders']}[t.dataset.tab];return replace(m[0])}
    if(t.dataset.go){const g=t.dataset.go;
      if(g==='addDeal'){st.form=Object.assign({date:todayISO(),name:'',phone:'',email:'',budget:'',touched:{}});return go('addDeal',{id:curPerson()})}
      if(g==='person')return go('person',{id:t.dataset.id});
      if(g==='detail')return go('detail',{id:t.dataset.id});
      return go(g)}
    const a=t.dataset.act,d=t.dataset;
    switch(a){
      case'login':return replace('home');
      case'toggleMenu':st.overlay=st.overlay==='menu'?null:'menu';return render();
      case'openDrawer':st.overlay='drawer';return render();
      case'closeOverlay':st.overlay=null;return render();
      case'menuItem':st.overlay=null;
        if(d.m==='logout')return replace('login');
        if(d.m==='account'){st.overlay='drawer';return render()}
        return toast(d.m==='about'?'Ledger App · v0.1 PoC':'Settings: coming soon');
      case'toast':return toast(d.msg);
      case'clearComposer':st.draft={amount:'',note:''};return render();
      case'sendDeal':{
        const amt=parseFloat(st.draft.amount);if(isNaN(amt))return toast('Enter an amount');
        const p=st.data.people.find(x=>x.id===curPerson());const n=nextInv(st);
        p.deals.unshift({id:'n'+Date.now(),invoice:'INV-'+String(n).padStart(6,'0'),amount:amt,title:null,note:st.draft.note||'—',date:todayISO(),time:new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})});
        st.draft={amount:'',note:''};return render()}
      case'submitDeal':{
        const f=st.form;f.touched={name:1,phone:1,email:1,budget:1};const v=validate(f);
        if(!Object.values(v).every(Boolean)){toast('Please fix the highlighted fields');return}
        const p=st.data.people.find(x=>x.id===curPerson());
        p.deals.unshift({id:'n'+Date.now(),invoice:'INV-'+String(nextInv(st)).padStart(6,'0'),amount:+f.budget,title:null,note:f.name,date:f.date,time:new Date().toLocaleTimeString('en',{hour:'2-digit',minute:'2-digit'})});
        st.stack.pop();st.toast='Deal added';render();setTimeout(()=>{st.toast=null;render()},1400);return}
      case'deleteDeal':{const {p,d:dd}=findDeal(st,d.id);p.deals=p.deals.filter(x=>x.id!==dd.id);st.stack.pop();return render()}
      case'removeTag':{const p=st.data.people.find(x=>x.id===d.pid);p.tags=p.tags.filter(x=>x!==d.tag);return render()}
      case'searchMode':st.search.mode=d.mode;return render();
      case'ordersTab':st.ordersTab=d.k;return render();
      case'dismissOrder':{for(const k in st.data.orders)st.data.orders[k]=st.data.orders[k].filter(o=>o.id!==d.id);return render()}
    }
  });
  el.addEventListener('input',e=>{
    const i=e.target;
    if(i.id==='c-amount'){st.draft.amount=i.value;i.closest('.composer').querySelector('.send').classList.toggle('ready',!!i.value)}
    else if(i.id==='c-note')st.draft.note=i.value;
    else if(i.id==='s-q'){st.search.q=i.value;st._focus='s-q';render()}
    else if(i.id==='f-date')st.form.date=i.value;
    else if(i.dataset.f){const k=i.dataset.f;st.form[k]=i.value;st.form.touched[k]=1;
      const lab=i.closest('.field');lab.classList.remove('ok','bad');lab.classList.add(validate(st.form)[k]?'ok':'bad')}
    else if(i.id==='d-desc'){st.data.people.find(x=>x.id===i.dataset.pid).description=i.value}
  });
  render();
  return{go,replace,st,render};
}

const GALLERY=[
 ['1 · Person ledger + composer','person',{id:'p1',kind:'money',back:false,fab:false}],
 ['2 · Add New Deal (validation)','addDeal',{id:'p1'},{form:{name:'Ali',touched:{name:1,phone:1,email:1}}}],
 ['3 · Orders panel','orders',{}],
 ['4 · Person deals (item) + FAB','person',{id:'p1',kind:'item',composer:false}],
 ['5 · History','history',{}],
 ['6 · Profile drawer','history',{},{overlay:'drawer'}],
 ['7 · Deal detail','detail',{id:'d1'}],
 ['8 · Search (Price / Text)','search',{}],
 ['9 · Login','login',{}],
 ['10 · Empty deals','home',{empty:true}],
 ['11 · Menu popover','home',{},{overlay:'menu'}],
];
function show(mode){
  document.querySelectorAll('#mode button').forEach(b=>b.classList.toggle('on',b.dataset.m===mode));
  root.innerHTML='';
  if(mode==='proto'){
    root.innerHTML='<div class="stage"><div class="phone" id="ph"></div></div>';
    Phone(document.getElementById('ph'),'login');
  }else{
    const g=document.createElement('div');g.className='gallery';
    GALLERY.forEach(([label,name,params,opts])=>{
      const c=document.createElement('div');c.className='cell';
      c.innerHTML=`<div class="label"><b>${label}</b></div><div class="phone"></div>`;g.appendChild(c);
      const ph=c.querySelector('.phone');
      // person screens need a stack so Back works
      const inst=Phone(ph,name,params,opts||{});
      if(name==='home'&&params.empty){/* empty flag handled via params */}
    });
    root.appendChild(g);
  }
}
document.getElementById('mode').addEventListener('click',e=>{const b=e.target.closest('button');if(b)show(b.dataset.m)});
show(new URLSearchParams(location.search).get('mode')==='gallery'?'gallery':'proto');
